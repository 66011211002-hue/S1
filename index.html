<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #4f7cff;
        }

        h1 {
            color: #315dcc;
        }

        .info {
            text-align: left;
            margin-top: 25px;
            line-height: 1.8;
        }

        .info h2 {
            color: #315dcc;
            border-bottom: 2px solid #dce5ff;
            padding-bottom: 5px;
        }

        .skills span {
            display: inline-block;
            background: #e4ebff;
            color: #315dcc;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 20px;
        }

        footer {
            margin-top: 30px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- รูปโปรไฟล์ -->
        <img src="profile.jpg" alt="รูปประจำตัว" class="profile-img">

        <h1>สวัสดีครับ ผมชื่อ นาย กฤษณะ เทพาฤทธิ์</h1>
        <p>นักศึกษา</p>

        <div class="info">

            <h2>ข้อมูลส่วนตัว</h2>
            <p><strong>ชื่อ:</strong>กฤษณะ เทพาฤทธิ์</p>
            <p><strong>ชื่อเล่น:</strong>ท็อป</p>
            <p><strong>อายุ:</strong> 222 ปี</p>
            
    </div>

</body>
</html>
